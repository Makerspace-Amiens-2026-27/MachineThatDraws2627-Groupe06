title: Doc Projet # À MODIFIER : le nom de votre projet
description: Documentation du projet # À MODIFIER : une phrase qui résume votre projet

# À MODIFIER : l'adresse de VOTRE repo GitHub (sans "/" à la fin).
gh_edit_repository: "https://github.com/Makerspace-Amiens-2026-27/MachineThatDraws2627-Groupe06"

# Thème
theme: just-the-docs

# Paramètres optionnels de "Just the Docs"
just_the_docs:
  navigation_depth: 5
  search_enabled: true
  search_indexing: true

# Diagrammes Mermaid
mermaid:
  version: "11.17.2"

# Lien "Modifier cette page sur GitHub"
gh_edit_link: true
gh_edit_link_text: "Modifier cette page sur GitHub"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

# Encadrés utilisables dans les pages
callouts:
  a_modifier:
    title: À modifier
    color: yellow
  a_supprimer:
    title: À supprimer
    color: red
  note:
    title: Note
    color: blue
  warning:
    title: Attention
    color: red

custom_css:
  - "/assets/css/winxp.css"

header_scripts:
  - "/assets/js/winxp.js"