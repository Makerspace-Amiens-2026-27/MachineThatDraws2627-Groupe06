{%- comment -%}
Affiche un modèle 3D (.glb) avec model-viewer.
Utilisation : {% include model3d.html src="assets/models/mon-modele.glb" alt="Description" %}
Paramètre optionnel : hauteur="500px"
{%- endcomment -%}
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4/dist/model-viewer.min.js"></script>
<model-viewer src="{{ include.src | relative_url }}" alt="{{ include.alt | default: 'Modèle 3D du projet' }}" camera-controls auto-rotate shadow-intensity="1" style="width: 100%; height: {{ include.hauteur | default: '400px' }}; background-color: #f5f6fa; border-radius: 4px;"></model-viewer>
