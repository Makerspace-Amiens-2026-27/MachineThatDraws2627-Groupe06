<!-- À placer dans : _includes/footer_custom.html -->
<style>
  /* Bouton "lien hypertexte" : même police que le thème, bleu, sans soulignement */
  #btn-switch-xp {
    font: inherit; font-size: 0.75rem; line-height: 1.4;
    color: #7253ed; /* couleur des liens du thème : changez-la ici si besoin */
    background: none; border: 0; padding: 0; margin: 0;
    text-decoration: none; cursor: pointer; box-shadow: none; border-radius: 0;
    /* repli si la barre latérale est introuvable */
    position: fixed; bottom: 15px; left: 15px; z-index: 999999;
  }
  #btn-switch-xp:hover { opacity: .75; text-decoration: none; }
  #btn-switch-xp:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  /* Placé DANS le pied de page du thème ("This site uses Just the Docs..."), tout en haut :
     il hérite donc de sa position, de son alignement et de sa taille de texte, sur tout écran. */
  #btn-switch-xp.in-footer {
    position: static; display: block; margin: 0 0 6px 0;
    font-size: inherit; text-align: left;
  }
  /* Repli : en bas de la barre latérale si le pied de page est introuvable */
  #btn-switch-xp.in-sidebar { position: static; display: block; margin: 8px 2rem; }
</style>

<button id="btn-switch-xp" type="button" data-xp-enter>Mode Windows XP</button>
<script>
  (function () {
    try {
      var btn = document.getElementById('btn-switch-xp');
      var foot = document.querySelector('.side-bar .site-footer') || document.querySelector('.site-footer');
      var sb = document.querySelector('.side-bar');
      if (btn && foot) { foot.insertBefore(btn, foot.firstChild); btn.classList.add('in-footer'); }
      else if (btn && sb) { sb.appendChild(btn); btn.classList.add('in-sidebar'); }
    } catch (e) {}
  })();
</script>
